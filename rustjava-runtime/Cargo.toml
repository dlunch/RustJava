[package]
name = "rustjava-runtime"
description = "A Java standard library implementation for RustJava"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
bytemuck = { workspace = true }
dyn-clone = { workspace = true }
hashbrown = { workspace = true }
libm = { version = "^0.2", default-features = false }
parking_lot = { workspace = true }
percent-encoding = { version = "^2.3", features = ["alloc"], default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["unicode"] }
tracing = { workspace = true }

chrono = { version = "^0.4", default-features = false }
encoding_rs = { version = "^0.8", features = ["alloc"], default-features = false }
tracing-attributes = { version = "<0.1.29" }                                       # Pin this to avoid compile error with no-std https://github.com/tokio-rs/tracing/issues/3388
url = { version = "^2.5", default-features = false }
zip = { version = "^9.0.5", features = ["deflate"], default-features = false }

jvm = { workspace = true }
jvm-class-proto = { workspace = true }
jvm-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

jvm-bytecode = { workspace = true }
test-utils = { workspace = true }
