[package]
name = "jvm-class-proto-macros"
description = "Procedural macros for implementing Java classes in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "^1.0"
quote = "^1.0"
syn = { version = "^3.0", features = ["full"] }
